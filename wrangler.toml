# Cloudflare Worker + static assets (deploy with: npm run build && npx wrangler deploy)
# "name" must match the Worker name in your Cloudflare dashboard.
name = "family-tree"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Storage for edits. Until this is set up, the site loads the bundled src/data/family-db.json
# and saving returns an error. To enable saving:
#   1. npx wrangler kv namespace create FAMILY_DB_KV   (or Dashboard → Storage & Databases → KV → Create)
#   2. Uncomment the 3 lines below and paste the namespace id.
# [[kv_namespaces]]
# binding = "FAMILY_DB_KV"
# id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"
