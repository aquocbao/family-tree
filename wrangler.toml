# Cloudflare Worker + static assets (deploy with: npm run build && npx wrangler deploy)
# "name" must match the Worker name in your Cloudflare dashboard.
name = "family-tree"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Storage for edits (Workers KV namespace "FAMILY_DB_KV").
# Until the first save, the site loads the bundled src/data/family-db.json.
[[kv_namespaces]]
binding = "FAMILY_DB_KV"
id = "20dc6446176d445fa17b4ea606838d77"
