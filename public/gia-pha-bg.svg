<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e8cf" />
      <stop offset="55%" stop-color="#ecd9b8" />
      <stop offset="100%" stop-color="#dfc8a2" />
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08" />
      </feComponentTransfer>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="70%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#5d3a12" stop-opacity="0.22" />
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)" />
  <rect width="1200" height="800" filter="url(#grain)" />
  <rect width="1200" height="800" fill="url(#vignette)" />

  <g stroke="#8a5a26" stroke-opacity="0.35" fill="none">
    <rect x="14" y="14" width="1172" height="772" rx="14" />
    <rect x="26" y="26" width="1148" height="748" rx="12" />
  </g>
</svg>
