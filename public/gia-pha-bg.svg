<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Aged rice-paper (giấy dó) tile: warm base, fine grain and long fibres. Repeats seamlessly. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.27  0 0 0 0 0.10  0 0 0 0.10 0" />
    </filter>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.18" numOctaves="3" seed="7" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.38  0 0 0 0 0.16  0 0 0 0.16 -0.04" />
    </filter>
    <filter id="blotch" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="3" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.60  0 0 0 0 0.42  0 0 0 0 0.18  0 0 0 0.22 -0.06" />
    </filter>
  </defs>
  <rect width="480" height="480" fill="#f3e6c8" />
  <rect width="480" height="480" filter="url(#blotch)" />
  <rect width="480" height="480" filter="url(#fibre)" />
  <rect width="480" height="480" filter="url(#grain)" />
</svg>
