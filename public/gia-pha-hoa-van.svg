<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Faint hoa văn tile for the page background: a round "Thọ" style medallion,
       tường vân (auspicious clouds) on the corners and small lozenges. Repeats seamlessly. -->
  <defs>
    <g id="cloud" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-30 6C-30-6-17-10-10-2C-8-15 8-15 10-2C17-10 30-6 30 6C30 12 25 14 20 12H-20C-25 14-30 12-30 6Z" stroke-width="2" />
      <path d="M-21 6c0-5 7-6 8-1M21 6c0-5-7-6-8-1M-5-3c0-6 10-6 10 0c0 4-6 4-6 0" stroke-width="1.4" />
      <path d="M-20 12c-6 4-12 3-15 0M20 12c6 4 12 3 15 0" stroke-width="1.4" />
    </g>
    <g id="medallion" fill="none" stroke-linecap="square">
      <circle r="34" stroke-width="2.4" />
      <circle r="29" stroke-width="1" />
      <!-- geometric key strokes, four-fold symmetric -->
      <path d="M0-22V22" stroke-width="2.6" />
      <path d="M-18-16H18M-18-16v5M18-16v5" stroke-width="2.2" />
      <path d="M-13 0H13M-13 0v-5M13 0v-5M-13 0v5M13 0v5" stroke-width="2.2" />
      <path d="M-18 16H18M-18 16v-5M18 16v-5" stroke-width="2.2" />
      <path d="M-24-6v12M24-6v12" stroke-width="1.6" />
      <circle r="38.5" stroke-width="0.8" stroke-dasharray="2 4" />
    </g>
    <path id="lozenge" d="M0-6L6 0L0 6L-6 0Z" />
  </defs>
  <g stroke="#8b2a1a" fill="#8b2a1a" opacity="0.12">
    <use href="#medallion" x="120" y="120" />
    <use href="#cloud" x="0" y="0" />
    <use href="#cloud" x="240" y="0" />
    <use href="#cloud" x="0" y="240" />
    <use href="#cloud" x="240" y="240" />
    <g stroke="none">
      <use href="#lozenge" x="120" y="0" />
      <use href="#lozenge" x="120" y="240" />
      <use href="#lozenge" x="0" y="120" />
      <use href="#lozenge" x="240" y="120" />
    </g>
  </g>
</svg>
